name: QEMU smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build ISO"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: qemu-smoke-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  qemu-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf -- \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Install QEMU test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            expect \
            netcat-openbsd \
            openssh-client \
            ovmf \
            python3-venv \
            qemu-system-x86 \
            sshpass \
            tesseract-ocr \
            xorriso
          python3 -m venv /tmp/workspace-vnc
          /tmp/workspace-vnc/bin/pip install --disable-pip-version-check vncdotool
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
            printf 'QEMU_ACCEL=-enable-kvm -cpu host\n' >> "$GITHUB_ENV"
            printf 'QEMU_GUEST_TRIES=80\n' >> "$GITHUB_ENV"
          else
            printf 'QEMU_ACCEL=-accel tcg,thread=multi -cpu max\n' >> "$GITHUB_ENV"
            printf 'QEMU_GUEST_TRIES=140\n' >> "$GITHUB_ENV"
          fi

      - name: Download and verify the matching ISO
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            build_sha="${{ github.event.workflow_run.head_sha }}"
          else
            run_id="$(gh run list \
              --workflow build-iso.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
            build_sha=""
          fi
          test -n "$run_id"
          if [[ -n "$build_sha" ]]; then
            test "$(git rev-parse HEAD)" = "$build_sha"
          fi
          printf 'Using build run %s for commit %s\n' \
            "$run_id" "$(git rev-parse HEAD)"
          gh run download "$run_id" --name WorkSpace-ISO --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          find dist -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Test live root and support services over serial
        run: |
          set -euo pipefail
          mkdir -p results/serial
          iso="$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          label="$(xorriso -indev "$iso" -pvd_info 2>&1 \
            | sed -n "s/^Volume id *: '\(.*\)'/\1/p" \
            | head -n 1)"
          test -n "$label"
          xorriso -osirrox on -indev "$iso" \
            -extract /workspace/boot/x86_64/vmlinuz-linux results/serial/vmlinuz-linux
          xorriso -osirrox on -indev "$iso" \
            -extract /workspace/boot/x86_64/initramfs-linux.img results/serial/initramfs-linux.img

          cat > /tmp/run-workspace-serial.sh <<EOF
          #!/usr/bin/env bash
          exec qemu-system-x86_64 $QEMU_ACCEL \
            -machine q35 \
            -m 4096 \
            -smp 2 \
            -kernel results/serial/vmlinuz-linux \
            -initrd results/serial/initramfs-linux.img \
            -append 'archisobasedir=workspace archisolabel=$label console=ttyS0,115200n8 systemd.unit=multi-user.target' \
            -cdrom '$iso' \
            -nic user,model=virtio-net-pci \
            -nographic \
            -monitor none \
            -no-reboot
          EOF
          chmod +x /tmp/run-workspace-serial.sh

          cat > /tmp/workspace-serial.exp <<'EOF'
          set timeout 420
          log_file -noappend results/serial/guest-console.log
          spawn /tmp/run-workspace-serial.sh
          expect {
            -re {login: *$} {}
            timeout { puts stderr "serial login prompt was not reached"; exit 1 }
            eof { puts stderr "QEMU exited before login"; exit 1 }
          }
          send -- "workspace\r"
          expect {
            -re {Password: *$} {}
            timeout { puts stderr "password prompt was not reached"; exit 1 }
          }
          send -- "workspace\r"
          expect {
            -re {[$#] *$} {}
            timeout { puts stderr "shell prompt was not reached"; exit 1 }
          }
          send -- "systemctl status workspace-operator-setup.service --no-pager -l; printf 'OPERATOR_STATUS=%s\\n' \"\$(systemctl is-active workspace-operator-setup.service)\"; workspace-status; nanolga demo --json; printf 'SERIAL%s\\n' 'READY'\r"
          expect {
            -re {SERIALREADY} {}
            timeout { puts stderr "guest service/runtime checks failed"; exit 1 }
            eof { puts stderr "QEMU exited during guest checks"; exit 1 }
          }
          send -- "\001x"
          expect eof
          EOF
          expect /tmp/workspace-serial.exp
          rm -f -- results/serial/vmlinuz-linux results/serial/initramfs-linux.img
          grep -q 'OPERATOR_STATUS=active' results/serial/guest-console.log
          grep -q 'WorkSpace boundary: external client' results/serial/guest-console.log
          grep -q 'LTCA ingress: not configured' results/serial/guest-console.log
          grep -q 'SERIALREADY' results/serial/guest-console.log

      - name: Test BIOS and UEFI graphical boots
        run: |
          set -euo pipefail
          mkdir -p results/gui
          iso="$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          read -r -a accel <<< "$QEMU_ACCEL"
          readonly vnc=/tmp/workspace-vnc/bin/vncdotool
          readonly ssh_options=(
            -o ConnectTimeout=3
            -o LogLevel=ERROR
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
          )

          cleanup_pid() {
            local pid="$1"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          ssh_guest() {
            local port="$1"
            shift
            sshpass -p workspace ssh \
              "${ssh_options[@]}" \
              -p "$port" \
              workspace@127.0.0.1 \
              "$@"
          }

          boot_and_probe() {
            local mode="$1"
            local display="$2"
            local ssh_port="$3"
            local vnc_port=$((5900 + display))
            local output="results/gui/$mode"
            local pid
            local ssh_ready=0
            local graphical_ready=0
            shift 3
            mkdir -p "$output"

            qemu-system-x86_64 "${accel[@]}" \
              -machine q35 \
              -m 4096 \
              -smp 2 \
              -boot d \
              -cdrom "$iso" \
              -nic "user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:${ssh_port}-:22" \
              -device virtio-vga \
              -display "vnc=127.0.0.1:$display" \
              -serial "file:$output/serial.log" \
              -monitor none \
              -no-reboot \
              "$@" \
              >"$output/qemu.log" 2>&1 &
            pid=$!

            for _ in $(seq 1 30); do
              nc -z 127.0.0.1 "$vnc_port" && break
              sleep 2
            done
            if ! nc -z 127.0.0.1 "$vnc_port"; then
              cleanup_pid "$pid"
              return 1
            fi

            for _ in $(seq 1 "$QEMU_GUEST_TRIES"); do
              if ssh_guest "$ssh_port" "printf SSHREADY" >/dev/null 2>&1; then
                ssh_ready=1
                break
              fi
              sleep 3
            done
            if [[ "$ssh_ready" -ne 1 ]]; then
              "$vnc" -s "127.0.0.1::$vnc_port" capture "$output/timeout.png" || true
              cleanup_pid "$pid"
              return 1
            fi

            for _ in $(seq 1 60); do
              if ssh_guest "$ssh_port" \
                "set -eu; systemctl is-active graphical.target sddm.service workspace-operator-setup.service getty@tty3.service; pgrep -u workspace -x plasmashell >/dev/null; pgrep -t tty3 -u operator -x bash >/dev/null; printf 'GRAPHICALREADY\\n'" \
                >"$output/guest-check.txt" 2>&1; then
                graphical_ready=1
                break
              fi
              sleep 3
            done

            "$vnc" -s "127.0.0.1::$vnc_port" capture "$output/desktop.png" || true
            tesseract "$output/desktop.png" stdout --psm 6 \
              2>/dev/null | tee "$output/desktop.txt" || true
            cleanup_pid "$pid"
            test "$graphical_ready" -eq 1
            grep -q 'GRAPHICALREADY' "$output/guest-check.txt"
          }

          boot_and_probe BIOS 1 2221

          ovmf_code="$(find /usr/share/OVMF -type f \
            \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) \
            -print -quit)"
          ovmf_vars="$(find /usr/share/OVMF -type f \
            \( -name 'OVMF_VARS_4M.fd' -o -name 'OVMF_VARS.fd' \) \
            -print -quit)"
          test -n "$ovmf_code"
          test -n "$ovmf_vars"
          cp "$ovmf_vars" results/gui/uefi-vars.fd
          boot_and_probe UEFI 2 2222 \
            -drive "if=pflash,format=raw,readonly=on,file=$ovmf_code" \
            -drive 'if=pflash,format=raw,file=results/gui/uefi-vars.fd'

          printf 'Serial runtime, BIOS Plasma and UEFI Plasma passed.\n' \
            | tee results/QEMU-SMOKE-PASSED.txt
          printf '## QEMU smoke test\n\nSerial runtime, BIOS Plasma and UEFI Plasma passed for the matching ISO.\n' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorkSpace-QEMU-evidence
          path: results
          if-no-files-found: warn
          retention-days: 14
